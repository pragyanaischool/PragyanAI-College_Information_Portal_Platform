name: CI/CD Pipeline - Test & Lint

on:
  push:
    branches:
      - main
      - master
      - develop
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches:
      - main
      - master
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort

      - name: Run Black Code Formatter Check
        run: |
          black --check src/ tests/

      - name: Run isort Import Sorting Check
        run: |
          isort --check-only --profile black src/ tests/

      - name: Run Flake8 Linting
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings. Max complexity and line length enforcement
          flake8 src/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics

  test-suite:
    name: Database Seeding & Pytest Suite
    needs: lint-and-format
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || 'mock_groq_api_key_for_ci' }}
      DATABASE_URL: "sqlite:///data/college_portal.db"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Production & Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-mock

      - name: Create Data Directory Structure
        run: |
          mkdir -p data/raw/brochures data/raw/presentations data/raw/regulatory data/seed data/vector_store

      - name: Execute Synthetic Database Seeder (15 Colleges & 1,000+ Students)
        run: |
          python -m src.db.seed_runner

      - name: Run Pytest with Coverage Report
        run: |
          pytest --cov=src --cov-report=xml --cov-report=term-missing tests/

      - name: Upload Test Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7
